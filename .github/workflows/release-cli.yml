name: release-cli

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Protected environment: require reviewer approval in repo settings
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "cli-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/cli version $version (expected cli-v$version)"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build:cli
      - name: Inspect tarball (no lifecycle scripts, no runtime deps)
        working-directory: packages/cli
        run: |
          npm pack --dry-run --json | tee /dev/stderr >/dev/null
          node -e "const p=require('./package.json');const bad=['preinstall','install','postinstall'].filter(k=>p.scripts?.[k]);if(bad.length||p.dependencies){console.error('unexpected',bad,p.dependencies);process.exit(1)}"
      - name: Publish
        working-directory: packages/cli
        run: npm publish --provenance --access public
