name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Check bundled CLI is up to date
        run: |
          pnpm --filter @robots-txt-optimizer/cli build
          git diff --exit-code -- packages/cli/dist || (echo "::error::packages/cli/dist is stale — run 'pnpm --filter @robots-txt-optimizer/cli build' and commit" && exit 1)

      - name: Check this site's robots.txt
        uses: ./
        with:
          path: public/robots.txt
          expect-allowed: |
            Googlebot:/
            Googlebot:/about
