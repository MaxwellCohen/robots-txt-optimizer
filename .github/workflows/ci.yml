name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Typecheck packages
        run: pnpm --filter @robots-txt-optimizer/core --filter @maxwellcohen/robots-txt-optimizer typecheck

      - name: Test
        run: pnpm run test

      - name: Check bundled CLI is up to date
        run: |
          pnpm build:cli
          git diff --exit-code -- packages/cli/dist || (echo "::error::packages/cli/dist is stale — run 'pnpm build:cli' and commit" && exit 1)

      - name: Check this site's robots.txt
        uses: ./
        with:
          path: public/robots.txt
          expect-allowed: |
            Googlebot:/
            Googlebot:/about
